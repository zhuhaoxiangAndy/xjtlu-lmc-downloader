<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>build-dir-tree</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>build-dir-tree</h1>
  <p class="sub">从 LMC / Moodle 课程页快照还原目录树 · 勾选需要创建的目录</p>
</header>

<main>
  <section class="card">
    <h2>1. 选择快照</h2>

    <div class="picker">
      <button id="browseFile" class="primary">选择课程快照…</button>
      <button id="browseDir" class="ghost">换个目录查找…</button>
      <button id="rescan" class="ghost">重新扫描</button>
      <span id="scanInfo" class="scan-info"></span>
    </div>

    <div id="found" class="found"></div>

    <details class="manual">
      <summary>或手动输入路径</summary>
      <label>课程页快照路径（.mhtml / .html）
        <input id="snapshot" type="text" placeholder="D:\Downloads\Course.mhtml" autocomplete="off">
      </label>
      <button id="load">载入</button>
    </details>
  </section>

  <section class="card">
    <h2>2. 输出位置</h2>
    <div class="picker">
      <button id="browseOut" class="ghost">选择输出目录…</button>
      <span id="outInfo" class="scan-info"></span>
    </div>
    <label>输出根目录（点「创建选中目录」时使用）
      <input id="output" type="text" placeholder="D:\Courses" autocomplete="off">
    </label>
    <label>顶层文件夹名（留空自动取课程标题）
      <input id="rootName" type="text" placeholder="留空自动生成" autocomplete="off">
    </label>
  </section>

  <section class="card">
    <h2>3. 命名选项</h2>
    <p class="hint">默认与 LMC 页面标题逐字符一致。改动后点「重新载入」生效。</p>

    <label class="inline"><input id="number" type="checkbox"> 加序号前缀（04- / 04.16- / 01 ）</label>
    <label class="inline"><input id="collapseSpaces" type="checkbox"> 合并连续空格</label>
    <label class="inline"><input id="dropTrailing" type="checkbox" checked> 去掉末尾空格和点</label>

    <div class="row">
      <label>空格替换为（留空 = 保持原样）
        <input id="spaceReplace" type="text" placeholder="留空则保留空格" autocomplete="off">
      </label>
    </div>

    <div class="row">
      <label>非法字符替换为（留空 = 直接删除，默认）
        <input id="illegalReplace" type="text" placeholder="留空则删除 &lt; &gt; : &quot; / \ | ? *" autocomplete="off">
      </label>
    </div>

    <button id="reload">重新载入</button>
  </section>

  <section class="card">
    <h2>4. 目录树</h2>
    <div class="tree-toolbar">
      <button id="expandAll" class="ghost">全部展开</button>
      <button id="collapseAll" class="ghost">全部折叠</button>
      <button id="selectAll" class="ghost">全选</button>
      <button id="selectNone" class="ghost">全不选</button>
      <button id="selectSections" class="ghost">只要章节</button>
      <span id="countLabel" class="count"></span>
    </div>
    <div id="tree" class="tree"></div>
  </section>

  <section class="card">
    <h2>5. 结果</h2>
    <div class="actions">
      <button id="create" class="primary">创建选中目录</button>
      <button id="copy" class="ghost">复制路径列表</button>
    </div>
    <div id="status" class="status"></div>
    <div id="summary" class="summary"></div>
    <pre id="out" class="out"></pre>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
