[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "build-dir-tree"
version = "1.4.1"
description = "Rebuild a course directory tree from a saved LMC/Moodle page snapshot"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["moodle", "lmc", "xjltu", "course", "directory-tree", "mhtml"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Education",
    "Topic :: Utilities",
]

[project.scripts]
build-dir-tree = "build_dir_tree.cli:main"
build-dir-tree-ui = "build_dir_tree.web.server:main"

[tool.setuptools]
packages = ["build_dir_tree", "build_dir_tree.web"]

[tool.setuptools.package-data]
build_dir_tree = ["py.typed", "web/static/*"]
