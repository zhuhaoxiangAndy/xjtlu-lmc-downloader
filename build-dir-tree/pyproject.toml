[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "build-dir-tree"
version = "1.6.0"
description = "Rebuild a course directory tree from a saved LMC/Moodle page snapshot"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["moodle", "lmc", "xjltu", "course", "directory-tree", "mhtml"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Education",
    "Topic :: Utilities",
]

# No [project.scripts] on purpose.
#
# pip turns console scripts into .exe stubs inside Scripts\, and on machines
# running Windows Defender Application Control (WDAC) those stubs are not on the
# allow list, so every invocation is blocked outright. .cmd shims are unaffected
# because the policy only governs PE executables.
#
# Install the shims once with:
#     python -m build_dir_tree.shims
#
# Until then use:
#     python -m build_dir_tree ...          CLI
#     python -m build_dir_tree.ui           graphical interface

[tool.setuptools]
packages = ["build_dir_tree", "build_dir_tree.web"]

[tool.setuptools.package-data]
build_dir_tree = ["py.typed", "web/static/*"]
