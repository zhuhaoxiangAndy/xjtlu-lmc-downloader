name: build-dir-tree

on:
  push:
    paths:
      - 'build-dir-tree/**'
      - '.github/workflows/build-dir-tree.yml'
  pull_request:
    paths:
      - 'build-dir-tree/**'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04 still ships Python 3.8; ubuntu-latest (26.04) does not.
          - os: ubuntu-24.04
            python-version: '3.8'
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.8'
          - os: windows-latest
            python-version: '3.10'
          - os: windows-latest
            python-version: '3.12'
    defaults:
      run:
        working-directory: build-dir-tree
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile check
        run: python -m compileall -q build_dir_tree tests
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
