name: build-dir-tree

on:
  push:
    paths:
      - 'build-dir-tree/**'
      - '.github/workflows/build-dir-tree.yml'
  pull_request:
    paths:
      - 'build-dir-tree/**'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.8', '3.10', '3.12']
    defaults:
      run:
        working-directory: build-dir-tree
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile check
        run: python -m compileall -q build_dir_tree tests
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
